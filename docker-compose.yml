services:
  nav-item:
    build:
      context: https://github.com/yuhuan457/nav-item.git#main
      dockerfile: Dockerfile
    container_name: nav-item
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=123456
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
    restart: unless-stopped
